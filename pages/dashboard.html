<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — CodeLens AI</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">
      <div class="brand-logo">CL</div>
      <div class="brand-text">CodeLens AI <span class="brand-badge">Dashboard</span></div>
    </div>
    <nav>
      <ul class="nav-menu">
        <li><a href="../index.html" class="nav-link active">Main App</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <div id="dashboard-view-container"></div>
  </main>
  <script src="../js/storage/history.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('dashboard-view-container');
      if (window.DashboardView && window.HistoryStorage) {
        window.DashboardView.render(container, window.HistoryStorage, (rev) => {
          window.location.href = '../index.html';
        });
      }
    });
  </script>
</body>
</html>
